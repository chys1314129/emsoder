name: Windows Tauri release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release-windows.yml"
      - "scripts/**"
      - "src/**"
      - "host/**"
      - "src-tauri/**"
      - "renderer/**"
      - "resources/core-skills-release.zip"
      - "package*.json"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a draft Release after tests pass (requires the matching version tag)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: emsoder-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    env:
      CI: "true"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Prepare runner temp paths
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:RUNNER_TEMP) { throw "RUNNER_TEMP is unavailable" }
          "EMSODER_USER_DATA=$env:RUNNER_TEMP/emsoder-test-userdata" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EMSODER_DOWNLOAD_DIR=$env:RUNNER_TEMP/emsoder-downloads" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EMSODER_WHEEL_DIR=$env:RUNNER_TEMP/emsoder-wheels" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout source, not local runtime caches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /scripts/
            /src/
            /host/
            /renderer/
            /src-tauri/
            /resources/core-skills/
            /resources/core-skills-release.zip
            /resources/icon*.png
            /resources/icon.ico
            /package.json
            /package-lock.json
            /LICENSE
            !/src-tauri/target/
            !/src-tauri/gen/
            !/renderer/vendor/

      - name: Setup build Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/release/runtime-package-lock.json

      - name: Validate source prerequisites and matching versions
        id: version
        run: |
          $ErrorActionPreference = "Stop"
          $rv = Get-Content scripts/release/runtime-versions.json -Raw | ConvertFrom-Json
          $coreArchive = "resources/core-skills-release.zip"
          if ((Get-FileHash $coreArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $rv.coreArchive.sha256) { throw "Core skill archive checksum mismatch" }
          Expand-Archive -Path $coreArchive -DestinationPath resources/core-skills -Force
          node scripts/release/prepare-runtime.js --check
          if ($LASTEXITCODE -ne 0) { throw "Missing or inconsistent release sources" }
          $info = node -e "const p=require('./scripts/release/prepare-runtime');const tag=process.env.GITHUB_REF_TYPE==='tag'?process.env.GITHUB_REF_NAME:'';console.log(JSON.stringify(p.versionInfo(tag)))"
          if ($LASTEXITCODE -ne 0) { throw "Tag/version validation failed" }
          $v = $info | ConvertFrom-Json
          "tag=$($v.tag)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$($v.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tagCommit = git rev-parse "$($v.tag)^{commit}"
            if ($LASTEXITCODE -ne 0 -or $tagCommit.Trim() -ne $env:GITHUB_SHA) { throw "Tag does not identify the checkout commit" }
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action, explicit toolchain
        with:
          toolchain: "1.98.1"
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies and build products
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
          # Never save a cache from a run that failed before it could build: a
          # partial src-tauri/target restored by the next run makes Cargo abort
          # with "failed to determine list of files in ... src-tauri" before it
          # compiles anything. Bump the prefix key to invalidate old caches.
          cache-on-failure: false
          prefix-key: v2

      - name: Setup build Python (not shipped wholesale)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.12"
          architecture: x64

      - name: Install locked application dependencies
        run: |
          $ErrorActionPreference = "Stop"
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          npm rebuild @homebridge/node-pty-prebuilt-multiarch
          if ($LASTEXITCODE -ne 0) { throw "PTY native build failed" }

      - name: Download and verify clean distributable runtimes
        run: |
          $ErrorActionPreference = "Stop"
          $v = Get-Content scripts/release/runtime-versions.json -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Path $env:EMSODER_DOWNLOAD_DIR -Force | Out-Null
          foreach ($name in @("node", "python")) {
            $archive = Join-Path $env:EMSODER_DOWNLOAD_DIR "$name.zip"
            Invoke-WebRequest -Uri $v.$name.url -OutFile $archive
            $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $v.$name.sha256) { throw "$name archive checksum mismatch" }
          }
          Expand-Archive -Path (Join-Path $env:EMSODER_DOWNLOAD_DIR "node.zip") -DestinationPath $env:EMSODER_DOWNLOAD_DIR
          Expand-Archive -Path (Join-Path $env:EMSODER_DOWNLOAD_DIR "python.zip") -DestinationPath (Join-Path $env:EMSODER_DOWNLOAD_DIR "python")
          $buildPython = Join-Path $env:RUNNER_TEMP "emsoder-build-python"
          python -m venv $buildPython
          if ($LASTEXITCODE -ne 0) { throw "Build Python venv failed" }
          $py = Join-Path $buildPython "Scripts/python.exe"
          New-Item -ItemType Directory -Path $env:EMSODER_WHEEL_DIR -Force | Out-Null
          & $py -m pip --isolated download --index-url https://pypi.org/simple --only-binary=:all: --require-hashes --dest $env:EMSODER_WHEEL_DIR -r scripts/release/requirements-windows.lock.txt
          if ($LASTEXITCODE -ne 0) { throw "A pinned Windows Python wheel is unavailable; do not silently drop dependencies" }
          "EMSODER_BUILD_PYTHON=$py" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare clean Node, Python and skill CLIs
        run: |
          node scripts/release/prepare-runtime.js
          if ($LASTEXITCODE -ne 0) { throw "Runtime preparation failed" }
          npm run build:pi-sidecar
          if ($LASTEXITCODE -ne 0) { throw "Pi bundle failed" }
          npm run build:host
          if ($LASTEXITCODE -ne 0) { throw "Host bundle failed" }
          npm run vendor
          if ($LASTEXITCODE -ne 0) { throw "WebView assets failed" }

      - name: Run release regression gates
        env:
          # Headless tests load src/**, which requires electron. The Tauri build
          # never downloads the Electron binary, so route require("electron") to
          # the production platform shim. Absolute path: NODE_OPTIONS is inherited
          # by child processes whose working directory differs.
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/release/ci-electron-shim.js
        run: |
          $ErrorActionPreference = "Stop"
          $tests = @("test:release-config", "test:providers", "test:pollinations", "test:keyless-integration", "test:keyless-ui", "test:config-secret-projection", "test:credential-catalog", "test:bridge-parity", "test:host-boot", "test:pi-sidecar", "test:pi-nested-adapter", "test:pi-token-stats", "test:context-history")
          foreach ($test in $tests) {
            npm run $test
            if ($LASTEXITCODE -ne 0) { throw "Test failed: $test" }
          }
          npm run preflight:share
          if ($LASTEXITCODE -ne 0) { throw "Runtime/share preflight failed" }
          node scripts/release/validate-release.js --resources
          if ($LASTEXITCODE -ne 0) { throw "Release resources are incomplete or contain private files" }

      - name: Build Windows x64 NSIS installer
        run: |
          $ErrorActionPreference = "Stop"
          # Diagnostics: Cargo's fingerprint walk aborts if src-tauri contains a
          # path it cannot enumerate, so record what is actually there first.
          if (Test-Path src-tauri/target) {
            $items = Get-ChildItem -Recurse -Force -ErrorAction SilentlyContinue src-tauri/target
            Write-Host "src-tauri/target entries: $($items.Count)"
          } else {
            Write-Host "src-tauri/target absent before build"
          }
          Write-Host "src-tauri entries: $((Get-ChildItem -Force src-tauri).Count)"
          npm run tauri:build -- --ci --target x86_64-pc-windows-msvc -- --locked
          if ($LASTEXITCODE -ne 0) { throw "Tauri compilation/bundling failed" }

      - name: Test actual release executable with local mock model
        env:
          EMSODER_EXE: src-tauri/target/x86_64-pc-windows-msvc/release/emsoder.exe
        run: |
          npm run test:chat
          if ($LASTEXITCODE -ne 0) { throw "Release window/chat smoke test failed; no Release will be created" }

      - name: Collect installer and checksum manifest
        run: |
          node scripts/release/validate-release.js --collect
          if ($LASTEXITCODE -ne 0) { throw "Release asset validation failed" }

      - name: Upload tested assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emsoder-windows-${{ steps.version.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: build
    if: github.event_name == 'push' || inputs.create_release == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      BUILD_VERSION: ${{ needs.build.outputs.version }}
      BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Download tested installer assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: emsoder-windows-${{ needs.build.outputs.version }}
          path: release-assets

      - name: Verify tag and create draft only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          tag = os.environ["RELEASE_TAG"]
          assert re.fullmatch(r"v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?", tag)
          repo = os.environ["GH_REPO"]
          ref = json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/git/ref/tags/{tag}"]))["object"]
          while ref["type"] == "tag":
              ref = json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/git/tags/{ref['sha']}"]))["object"]
          if ref["sha"] != os.environ["BUILD_SHA"]:
              raise SystemExit("The remote version tag does not match the tested commit")
          import hashlib
          assets = pathlib.Path("release-assets")
          checksums = {}
          for line in (assets / "SHA256SUMS.txt").read_text().splitlines():
              digest, name = line.split("  ", 1)
              if pathlib.Path(name).name != name or not re.fullmatch(r"[0-9a-f]{64}", digest):
                  raise SystemExit("Invalid checksum manifest entry")
              checksums[name] = digest
              if hashlib.sha256((assets / name).read_bytes()).hexdigest() != digest:
                  raise SystemExit(f"Artifact checksum mismatch: {name}")
          expected = {f"EMSoder-{os.environ['BUILD_VERSION']}-windows-x64-setup.exe", "build-info.json", "LICENSE"}
          if set(checksums) != expected or {p.name for p in assets.iterdir()} != expected | {"SHA256SUMS.txt"}:
              raise SystemExit("Unexpected or missing release assets")
          meta = json.loads(pathlib.Path("release-assets/build-info.json").read_text())
          if meta["commit"] != ref["sha"] or meta["version"] != os.environ["BUILD_VERSION"]:
              raise SystemExit("Artifact metadata does not match the version tag")
          existing = subprocess.run(["gh", "release", "view", tag, "--json", "isDraft"], capture_output=True, text=True)
          if existing.returncode == 0:
              if not json.loads(existing.stdout)["isDraft"]:
                  raise SystemExit("Refusing to overwrite an already published release")
              subprocess.check_call(["gh", "release", "upload", tag, *[str(p) for p in pathlib.Path("release-assets").glob("*")], "--clobber"])
          else:
              subprocess.check_call(["gh", "release", "create", tag, *[str(p) for p in pathlib.Path("release-assets").glob("*")], "--verify-tag", "--draft", "--title", f"EMSoder {tag} Windows x64", "--notes", "Windows x64 Tauri build. Tests passed before draft creation. Review installer, licenses and SHA256SUMS before publishing. Unsigned builds may show Windows SmartScreen warnings."])
          PY
